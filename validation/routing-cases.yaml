  not: [month-end-close, bas-preparation]
  prompt: A cafe client's bookkeeper has allocated 3 months of bank feed transactions in Xero. Check each allocation against the chart of accounts and the receipts, find duplicates and gaps, and list what needs fixing before we close the quarter.
- id: monthly-close
  skill: month-end-close
  not: [au-bookkeeping, year-end-workpapers]
  prompt: We want to lock October 2026 for a distribution business with 40 staff. Make sure the bank and control accounts agree, the accruals and prepayments are in, and explain the large movements against budget.
- id: subledger-difference
  skill: reconciliation-break-trace
  not: [month-end-close, au-bookkeeping]
  prompt: The trade creditors subledger is $14,380.55 higher than the control account at 31 October and the bank reconciliation is out by $612. Find the entries that make up each difference, what caused them and who needs to fix them.
- id: annual-workpaper-pack
  skill: year-end-workpapers
  not: [workpaper-tie-out, au-financial-statements]
  prompt: From the 30 June 2026 trial balance, put together the file the partner will review, with support for every balance and an explanation of the large movements from last year.
- id: statements-trace-and-recalculate
  skill: workpaper-tie-out
  not: [year-end-workpapers, au-financial-statements]
  prompt: The draft financial statements are ready for manager review. Check every number against its support and the source exports, recalculate the notes and list anything that does not agree.
- id: draft-statements-disclosures
  skill: au-financial-statements
  not: [year-end-workpapers, workpaper-tie-out]
  prompt: From this final trial balance for a large proprietary company, prepare the draft annual accounts and check the notes its reporting framework requires.
- id: xero-year-end-exports
  skill: xero-exports
  not: [contracting-exports, year-end-workpapers]
  prompt: I have downloaded the trial balance, aged receivables and account transactions reports from Xero at 30 June 2026. Check they are complete and the totals agree, and flag any old debtors.
- id: accountright-year-end-exports
  skill: myob-exports
  not: [xero-exports, year-end-workpapers]
  prompt: I exported the trial balance, aged payables and GST summary from our client's AccountRight file for 30 June 2026. Check they are complete, on the right basis and agree to the ledger before we start the year-end file.
- id: thirteen-week-cash
  skill: cashflow-forecast-13week
  not: [financial-modelling]
  prompt: A joinery client is short of cash after a slow quarter. Show week by week, for the next 3 months, whether it can pay its bills, using the aged debtors and creditors, payroll and the next BAS and super payments.
- id: bank-loan-forecast-model
  skill: financial-modelling
  not: [cashflow-forecast-13week, au-tax-planning-review]
  prompt: A client wants 3 years of projected profit, cash and balance sheet in Excel to support a bank loan for a second clinic. Build it with the assumptions on one sheet, live formulas and checks that prove it balances.
- id: budget-workbook-review
  skill: financial-modelling
  not: [cashflow-forecast-13week, workpaper-tie-out]
  prompt: Review the 5-year budget spreadsheet a client built for its board. Find hard-coded numbers inside formulas, checks that do not balance and scenarios that do not tie back to last year's accounts.
- id: coal-mine-fitters
  skill: coal-lsl-levy
  not: [payroll-tax-contractors, au-payroll-review]
  prompt: A maintenance contractor sends fitters to work at 2 open-cut black coal mines in the Hunter. Check which employees the industry's portable leave fund covers and prepare this month's return to it.
- id: job-cost-to-complete
  skill: contract-cost-tracking
  not: [wip-over-under-billing, plant-and-equipment-costing]
  prompt: For a $2.4 million civil job, show what we have spent and committed on labour, plant, subcontractors and materials, what is left to spend and the margin we will finish with.
- id: contracting-system-exports
  skill: contracting-exports
  not: [xero-exports, contract-cost-tracking]
  prompt: I need the job P&L, the claims register, plant hire dockets and payroll by job out of our job costing system for June. Tell me which reports to pull and with what settings, and check that they are complete before anyone uses them.
- id: excavator-hourly-cost
  skill: plant-and-equipment-costing
  not: [au-depreciation-schedule, fuel-tax-credits]
  prompt: Our civil client owns 6 excavators and 2 graders. Work out a standing and running cost per hour for each machine and whether the wet hire rates it charges cover them.
- id: fit-out-progress-claim
  skill: progress-claim-preparation
  not: [retention-schedule, wip-over-under-billing]
  prompt: Our subcontractor client is claiming for March on a commercial fit-out in Sydney, with 2 approved variations and 5% retention held. Prepare March's claim for payment and check it meets the security of payment requirements.
- id: retention-release-dates
  skill: retention-schedule
  not: [progress-claim-preparation, wip-over-under-billing]
  prompt: We hold retention on 9 subcontracts across 3 Queensland projects, and 2 defects liability periods end next month. List each retention with its release date and amount, and check the trust account requirements.
- id: construction-wip-schedule
  skill: wip-over-under-billing
  not: [contract-cost-tracking, progress-claim-preparation]
  prompt: At 30 June we have 7 construction contracts in progress. Show how complete each job is, which jobs are billed ahead of or behind the work done, and the contract assets and liabilities for the financial statements.
- id: fixed-price-revenue-timing
  skill: wip-over-under-billing
  not: [contract-cost-tracking, au-financial-statements]
  prompt: On a fixed-price contract to build a warehouse on the customer's land, is revenue recognised over time, and how should 2 variations the customer has not yet approved be treated at year end?

- id: smsf-member-died
  skill: au-smsf-death-benefits
  not: [au-smsf-year-end, au-deceased-estates]
  prompt: One of the 2 members of a self-managed super fund died last month. She had a pension and had signed a nomination for her adult son some years ago. Work out who the trustee can pay, in what form, and what each side needs on file.
- id: private-company-final-dividend
  skill: au-franking-account
  not: [div7a-compliance, au-company-tax]
  prompt: A family company wants to pay a final dividend before 30 June, partly by crediting a director's loan account. Prepare what the directors need for the resolution, the franking and the shareholder statements.
- id: family-trust-election-decision
  skill: au-family-trust-election
  not: [au-trust-losses, au-trust-distributions]
  prompt: A discretionary trust is thinking about making a family trust election this year, backdated to an earlier year, so it can use an old loss and pass franking credits through. Prepare what the trustee needs to decide, including who the test individual should be.

- id: main-residence-former-home-let
  skill: au-main-residence
  not: [au-capital-gains, au-rental-property]
  prompt: A client lived in her house for 4 years, then rented it out for 7 years while living in a new home she bought. She has now sold the old house. How much of the gain does the main residence exemption cover, and what does she have to choose?
- id: main-residence-spouses-acreage
  skill: au-main-residence
  not: [au-capital-gains, au-primary-production]
  prompt: A married couple each lived in a different home they own for part of the time, and the one being sold sits on 5 hectares with some of it leased for grazing. Prepare the main residence exemption workpaper.
- id: buy-back-private-company
  skill: au-share-buy-back
  not: [au-franking-account, div7a-compliance]
  prompt: A private company wants to buy back all of one shareholder's shares for more than their paid-up capital and pay most of it as a franked dividend. Prepare the workpapers for the company and the departing shareholder.
- id: buy-back-listed-tender
  skill: au-share-buy-back
  not: [au-capital-gains, au-dssp]
  prompt: My client sold shares into a listed company's off-market tender buy-back this year. How do we work out her capital proceeds, and is any of the price a dividend?
- id: client-meeting-transcript-file-note
  skill: au-client-meeting-note
  not: [au-tax-research, au-client-acceptance]
  prompt: Here is the AI transcript of this morning's video call with a client and her husband. Write it up as a file note for the partner to review, including what we agreed to do and anything she asked us to take on.
- id: approved-advice-to-client-letter
  skill: au-client-letter
  not: [au-client-meeting-note, au-tax-research, au-trust-distributions]
  prompt: The partner signed off our advice on the client's trust distribution question yesterday. Put it into our standard letter template so it can go to the client, and make it read a little less formally.
- id: marketplace-payouts-booked-as-sales
  skill: marketplace-settlements
  not: [au-short-stay-accommodation, au-bookkeeping, reconciliation-break-trace]
  prompt: A client sells homewares through an online marketplace and is paid every week after the platform takes its fees, refunds and a reserve. The bookkeeper has been recording each payout as sales. Rebuild the month from the settlement reports and tie the payouts to the bank before we do the BAS.
