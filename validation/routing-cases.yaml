# Routing checks for `accounting-skills build-plugin-evals`: each prompt names no skill, so
# a run shows whether Claude Code picks `skill` from the listing and avoids the
# neighbouring skills in `not`. All facts are synthetic. Graders check only which
# skill fired, never the answer.
- id: payroll-tax-multistate-threshold
  skill: au-payroll-tax-states
  not: [payroll-tax-contractors]
  prompt: Our group employs staff in New South Wales and Victoria and pays about $2.1 million of Australian wages a year. Which states do we register in for payroll tax, and how is the tax-free threshold shared between them?
- id: payroll-tax-grouping
  skill: au-payroll-tax-states
  not: [au-business-formation]
  prompt: Two of our client's companies share a director and move staff between them. Are they grouped for payroll tax in Queensland and Western Australia, and what does grouping change?
- id: payroll-tax-labour-only-subcontractor
  skill: payroll-tax-contractors
  not: [au-payroll-tax-states]
  prompt: We pay a carpentry subcontractor in Sydney about $180,000 a year for labour only. Is that deemed wages for payroll tax, and could an exemption apply?
- id: payroll-tax-on-hire-chain
  skill: payroll-tax-contractors
  not: [au-payroll-review]
  prompt: A labour hire firm places workers on our Parramatta site through a second agency. Who is liable for New South Wales payroll tax on those wages?
- id: subcontractor-sg-and-tpar
  skill: contractor-super-tpar
  not: [payroll-tax-contractors]
  prompt: Our building company pays 12 individual subcontractors with ABNs. Check whether any of them count as employees for super guarantee and whether we must lodge a taxable payments annual report.
- id: pay-run-before-approval
  skill: au-payroll-review
  not: [stp-finalisation]
  prompt: Before I approve this fortnight's pay run for 14 employees, check the gross-to-net figures, the PAYG withholding and the super for anything that looks wrong.
- id: stp-year-end
  skill: stp-finalisation
  not: [au-payroll-review]
  prompt: It is July 2026. Reconcile our payroll register to the general ledger and to the STP-filed totals so we can make the 2025-26 finalisation declaration.
- id: gst-control-account-to-labels
  skill: bas-preparation
  not: [au-gst-registration-review]
  prompt: For the March 2026 quarter, tie our Xero GST control account to labels 1A and 1B and explain the $412 difference before we lodge.
- id: gst-registration-threshold
  skill: au-gst-registration-review
  not: [bas-preparation]
  prompt: My consulting turnover will reach about $82,000 this year. Do I have to register for GST, and how should I treat the overseas software subscriptions I pay for?
- id: gst-townhouse-development
  skill: au-gst-property
  not: [bas-preparation]
  prompt: We are buying a vacant block to build 4 townhouses for sale. What GST evidence should we keep for the purchase and the sales, including whether the margin scheme is available?
- id: gst-missing-credits-audit
  skill: bas-preparation
  not: [au-bookkeeping]
  prompt: Go through this quarter's Xero transactions and find any GST credits claimed on bank fees, insurance or other purchases that carry no GST, before the activity statement goes in.
- id: gst-going-concern-sale
  skill: au-gst-property
  not: [au-capital-gains]
  prompt: A client sold a tenanted commercial building. Is the sale a GST-free supply of a going concern, and what documents show that it qualifies?
- id: fuel-tax-credit-earthmoving
  skill: fuel-tax-credits
  not: [bas-preparation]
  prompt: Our earthmoving business runs 3 excavators on site and 2 trucks that also travel on public roads. Prepare the fuel tax credit figures for this quarter's activity statement.
- id: cgt-share-parcels-register
  skill: au-capital-gains
  not: [au-small-business-cgt]
  prompt: Prepare a CGT event register for a client who sold 3 parcels of listed shares and an investment unit during 2025-26, with the cost base evidence for each.
- id: cgt-capital-loss-reconciliation
  skill: au-capital-gains
  not: [au-crypto-tax]
  prompt: Reconcile a client's carried-forward capital losses against this year's capital gains and show which losses are used and which carry forward.
- id: cgt-business-sale-concessions
  skill: au-small-business-cgt
  not: [au-capital-gains]
  prompt: A client is selling their plumbing business for $1.4 million after 17 years. Can they use the 15-year exemption or the retirement exemption, and what evidence do we need?
- id: cgt-net-asset-value-test
  skill: au-small-business-cgt
  not: [au-financial-statements]
  prompt: Our client company and its related entities have about $5.8 million of net assets. Check the $6 million maximum net asset value test before the share sale goes ahead.
- id: cgt-foreign-resident-apartment
  skill: au-nonresident-cgt
  not: [au-capital-gains]
  prompt: A client who lives in the United Kingdom is selling an apartment in Brisbane. What capital gains tax and foreign resident withholding apply to the sale?
- id: cgt-crypto-exchange-export
  skill: au-crypto-tax
  not: [au-capital-gains]
  prompt: Here is a summary of a client's exchange export for 2025-26, which shows 14 coin-to-coin swaps, monthly staking rewards and 3 transfers between their own wallets. Work out which events are disposals.
- id: cgt-rsu-vest-and-sale
  skill: au-employee-share-schemes
  not: [au-capital-gains]
  prompt: My employer's RSUs vested in October 2025 and I sold half of them in March 2026. Prepare the workpaper for my tax return.
- id: franking-account-rebuild
  skill: au-franking-account
  not: [au-company-tax, div7a-compliance]
  prompt: Our client's franking account in the ledger does not agree with its tax payments, and the directors want to pay a fully franked dividend next month. Rebuild the account and check the proposed distribution.
- id: trust-deed-abstract
  skill: au-trust-deed-review
  not: [au-trust-distributions]
  prompt: Before we draft this year's distribution minutes, go through the family trust's deed and its 2 variations and set out who the appointor is, which beneficiaries can receive income and whether capital gains can be streamed.
- id: restructure-to-company
  skill: au-restructure-rollovers
  not: [au-small-business-cgt, au-business-formation]
  prompt: A sole trader wants to move the business assets into a new company owned by the same person. What evidence do we need to check whether a CGT rollover is available for the transfer?
- id: professional-practice-profit-allocation
  skill: au-professional-firm-profits
  not: [au-psi-review, au-partnership-tax]
  prompt: An accounting partner takes a small salary and most of the practice profit goes to her family trust. Check the arrangement against the ATO's guidance on allocating profits from professional firms.
- id: objection-amended-assessment
  skill: au-ato-objection
  not: [au-return-amendment, au-ato-penalties-interest]
  prompt: The ATO issued an amended assessment disallowing a client's rental deductions and we disagree. Prepare a formal objection, including whether we are still within time.
- id: private-ruling-request
  skill: au-private-ruling-application
  not: [au-tax-research]
  prompt: The client wants certainty from the ATO before selling shares in a family company to a related trust. Prepare the application asking the Commissioner to rule on the arrangement.
- id: tax-agent-code-self-review
  skill: au-tax-agent-obligations
  not: [au-client-acceptance, au-aml-ctf-client-coverage]
  prompt: As the practice's supervising registered tax agent I need to check our own compliance with the Code of Professional Conduct, Tax Practitioners Board notifications and breach reporting.
- id: asic-director-resignation
  skill: au-asic-company-changes
  not: [au-business-formation]
  prompt: The sole director of a client's proprietary company is resigning and his daughter is taking over. What ASIC notifications, forms and board resolutions are needed?
- id: work-travel-claim
  skill: au-travel-expenses
  not: [au-car-expenses, au-individual-return]
  prompt: An employee flew to Perth for 3 weeks of training, stayed in a hotel and received a meal allowance, then added a week of holiday. Work out what travel costs he can claim.
- id: fixed-asset-tax-schedule
  skill: au-depreciation-schedule
  not: [plant-and-equipment-costing, month-end-close]
  prompt: Prepare the tax depreciation schedule from this fixed asset register, including the small business pool and the 3 assets sold during the year, and reconcile it to accounting depreciation.
- id: subdivision-revenue-or-capital
  skill: au-property-development-income
  not: [au-gst-property, au-capital-gains]
  prompt: Clients subdivided the block their home sits on into 3 lots, sold 2 and kept the house. Is the profit on revenue or capital account?
- id: farm-deposits-and-averaging
  skill: au-primary-production
  not: [au-non-commercial-losses]
  prompt: A grain farmer withdrew a farm management deposit early after a dry year and asks how income averaging and his cattle numbers affect this year's return.
- id: late-super-statement
  skill: au-super-guarantee-charge
  not: [stp-finalisation, contractor-super-tpar]
  prompt: Our client paid its staff super late for the March 2026 quarter and missed some employees entirely. Prepare what we need to lodge the statement for the shortfall.
- id: award-back-pay
  skill: au-award-underpayment-review
  not: [au-payroll-review]
  prompt: A cafe client thinks it has been paying its weekend staff below the hospitality award for 2 years. Work out the back pay owed to each employee.
- id: pdf-statement-import
  skill: statement-to-csv
  not: [au-bookkeeping, xero-exports]
  prompt: Here are 6 months of bank statement PDFs for a client. Turn them into a file I can import into Xero and check the balances agree.
- id: buying-a-business-review
  skill: au-business-acquisition-review
  not: [au-gst-property, div7a-compliance]
  prompt: Our client is buying all the shares in a plumbing company. Prepare the financial and tax due diligence and a list of the risks we find.
- id: director-penalty-notice
  skill: au-director-penalty-review
  not: [au-ato-penalties-interest, au-super-guarantee-charge]
  prompt: Both directors of a struggling company have received director penalty notices for unpaid PAYG withholding and GST. Work out what each notice covers and what evidence they need.
