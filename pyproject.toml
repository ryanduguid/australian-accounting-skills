# Tool configuration only. This repository is a set of agent skills, not a
# Python distribution: nothing here is installed or built, and the single test
# dependency stays pinned in requirements-test.txt.

[tool.pyright]
pythonVersion = "3.14"
include = ["scripts", "tests"]
# tests/ puts scripts/ on sys.path to import the standalone entry points
# there by name; Pyright has to resolve them from the same place.
extraPaths = ["scripts"]
typeCheckingMode = "standard"
# The lint job installs no runtime packages, so PyYAML is absent there;
# Pyright's bundled stubs still type-check its use.
reportMissingModuleSource = "none"

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
target-version = "py314"

[tool.ruff.lint]
# Ruff's default set plus import sorting: pycodestyle errors that are not
# formatting opinions (E4, E7, E9), all of pyflakes (F), and isort (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.report]
# A script's entry guard only calls main() or run(), which the tests call directly.
exclude_also = ['if __name__ == "__main__":']
