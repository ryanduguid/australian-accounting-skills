[package]
name = "accounting-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# `cargo run` without `--bin` runs this binary, not workpaper-renderer.
default-run = "accounting-skills"
license = "Apache-2.0"
authors = ["Ryan Duguid"]
description = "Native tooling for the accounting skill repository"
publish = false

[dependencies]
fancy-regex = "=0.20.2"
# The system time zone, read from the zoneinfo files or, on Windows, a bundled copy.
jiff = { version = "=1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.11.1"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
unicode-normalization = "=0.1.25"
yaml-rust2 = { version = "=0.13.1", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
