version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # move together: a job running one release against the other's config
      # fails outright. Grouped so the pair can never arrive split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Minor and patch action updates arrive as one pull request, so they need
      # one rebase and CI run instead of one each. Majors stay separate for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /tools/accounting-skills
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Pinned so its Unicode 16.0 tables match Python 3.14's normalisation.
      # A newer release changes the Unicode version and must be requalified
      # against the Python version the comparisons run. Security updates
      # still arrive, for that requalification.
      - dependency-name: unicode-normalization
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
