name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-skills.yml@f068fb4f1d8f90e07429ded7cfb85bdbcc2960fe
    with:
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/verify.yml: lint
        .github/workflows/verify.yml: secrets
        .github/workflows/verify.yml: shared conformance / verify skill-pack consumer
        .github/workflows/verify.yml: verify (3.14)
        .github/workflows/verify.yml: verify-gates
        .github/workflows/codeql.yml: Analyze (actions)
        .github/workflows/codeql.yml: Analyze (python)
        .github/workflows/codeql.yml: codeql-gates
      artifact-stem: australian-accounting-skills
      skills-verification-mode: subcontractor-accounting-v1
