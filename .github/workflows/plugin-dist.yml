name: Plugin branch

# The Claude plugin directory reads every file under the plugin folder and holds
# a version for review when it cannot inspect one. This keeps the claude-plugin
# branch to the files the plugin loads, built from main by
# `accounting-skills build-plugin-dist`. The install routes on main are unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    # Only main is published, including on a manual run.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the generated claude-plugin branch.
    env:
      BRANCH: claude-plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        # rustup reads the version from rust-toolchain.toml in this directory.
        working-directory: tools/accounting-skills
        run: rustup toolchain install

      - name: Build the plugin
        run: cargo run --locked --manifest-path tools/accounting-skills/Cargo.toml -- build-plugin-dist "$RUNNER_TEMP/plugin"

      # The token reaches only this step, after the build has run.
      - name: Commit the plugin to its branch when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin.index"
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$RUNNER_TEMP/plugin" -C "$RUNNER_TEMP/plugin" add --all --force .
          tree="$(git write-tree)"
          parent=""
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
            parent="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "The plugin is unchanged on $BRANCH at $parent."
              exit 0
            fi
          fi
          commit="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" ${parent:+-p "$parent"} -m "Build the plugin from $GITHUB_SHA")"
          # Not forced: a branch that moved since the fetch refuses the push.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$commit:refs/heads/$BRANCH"
          echo "Pushed $commit to $BRANCH."
