name: VirusTotal

on:
  # Releases made with GITHUB_TOKEN raise no release event, so follow the release workflows.
  workflow_run:
    workflows:
      - Release
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to scan.
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write # The reusable workflow edits the release notes in a separate job.
    uses: ryanduguid/release-policy/.github/workflows/virustotal-release.yml@ca5492bd09693be9e1fd47d980e2740ef8daf023
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    secrets:
      vt-api-key: ${{ secrets.VT_API_KEY }}
