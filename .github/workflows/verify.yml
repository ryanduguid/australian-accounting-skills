name: Verify

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "49 5 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check --only-binary ':all:' --require-hashes --requirement requirements-lint.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pyright
        run: python -m pyright

      # Each release asset is checked against the digest recorded at pin time
      # (koalaman publishes no checksums file). actionlint finds ShellCheck on
      # the path and runs it over the workflows' run: scripts.
      - name: Install the pinned shell and workflow linters
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linters"
          cd "$RUNNER_TEMP/linters"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          echo "$PWD" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh

      - name: actionlint
        run: actionlint

  verify:
    needs: lint
    timeout-minutes: 15
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --requirement requirements-test.txt  # NOSONAR: unprivileged job; the hash-pinned test requirement has no Python 3.15 wheel yet

      - name: Verify skill metadata
        run: python -m unittest discover -s tests -v

      - name: Verify fabricated validation pack
        run: python scripts/validate_validation.py

      - name: Verify Skills CLI discovery
        run: python tests/verify_skills_cli.py

  # The native Rust tooling in tools/accounting-skills. Its build-coverage,
  # sweep-outcome, prepare-trial and build-plugin-evals commands are the only
  # implementations, and this job's build-coverage --check is the coverage
  # matrix gate. Its check-citations is the citation gate: every section and
  # ruling a skill cites needs a record in that skill's sources.json. For the scripts still in scripts/ it is a candidate port, so
  # the job replays their original tests and fabricated comparisons against it.
  # No indexed source is fetched.
  native:
    name: native
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tools/accounting-skills
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The comparisons were qualified against this patch, which is also
          # the version of the frozen CPython references in tests/. Move it
          # deliberately, with a passing run.
          python-version: "3.14.8"

      - name: Install test dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check --only-binary ':all:' --require-hashes --no-deps --requirement requirements-test.txt

      - name: Install the pinned Rust toolchain
        # rustup reads the version from rust-toolchain.toml in this directory.
        run: rustup toolchain install

      - name: Add llvm-tools for the coverage run
        if: matrix.os == 'ubuntu-latest'
        run: rustup component add llvm-tools

      - name: Install the pinned cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Restore the dependency build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/accounting-skills
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked --all-targets

      # The floor is the measured line coverage, rounded down (73.23% on
      # 4 November 2026). Raise it with the tests, never lower it to pass.
      - name: Rust tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 73

      - name: Build
        run: |
          cargo build --locked --release
          cargo build --locked --examples --bins

      - name: Check this tree with the native commands
        run: |
          target/release/accounting-skills validate-validation --root "$GITHUB_WORKSPACE"
          target/release/accounting-skills build-coverage --root "$GITHUB_WORKSPACE" --check > /dev/null
          target/release/accounting-skills check-citations --root "$GITHUB_WORKSPACE"

      - name: Compare with the original scripts
        env:
          RECORDS: ${{ runner.temp }}/native-comparisons
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          binary="target/debug/accounting-skills$exe"
          probes=target/debug/examples
          mkdir -p "$RECORDS"
          for slice in validation source_refresh source_passages; do
            python -I "tests/${slice}_parity.py" --root "$GITHUB_WORKSPACE" --binary "$binary" \
              --probe "$probes/${slice}_probe$exe" --record "$RECORDS/$slice.json"
          done
          python -I tests/fetch_policy_parity.py --root "$GITHUB_WORKSPACE" \
            --probe "$probes/fetch_policy_probe$exe" --record "$RECORDS/fetch_policy.json"
          for slice in source_codecs multibyte; do
            python -I "tests/${slice}_parity.py" --root "$GITHUB_WORKSPACE" \
              --probe "$probes/source_refresh_probe$exe" --record "$RECORDS/$slice.json"
          done
          python -I tests/gb18030_parity.py --root "$GITHUB_WORKSPACE" --probe "$probes/gb18030_probe$exe" \
            --production-probe "$probes/source_refresh_probe$exe" --record "$RECORDS/gb18030.json"

      # A candidate for local testing, not a release: no checksum, attestation
      # or signature covers it, and it expires after 7 days.
      - name: Keep the release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accounting-skills-${{ runner.os }}
          path: |
            tools/accounting-skills/target/release/accounting-skills${{ runner.os == 'Windows' && '.exe' || '' }}
            tools/accounting-skills/README.md
            tools/accounting-skills/PYTHON-LICENSE.txt
            LICENSE
            NOTICE
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  shared-conformance:
    name: shared conformance
    permissions:
      contents: read
    uses: ryanduguid/release-policy/.github/workflows/verify-skills.yml@ca5492bd09693be9e1fd47d980e2740ef8daf023
    with:
      skills-verification-mode: subcontractor-accounting-v1

  # Measures the unit tests' branch coverage for the Codecov badge. It runs
  # apart from the other jobs so their commands stay unchanged.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install the hash-pinned coverage tool and test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=coverage,pyyaml --requirement requirements-coverage.txt
      - name: Run the unit tests under branch coverage
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests
      - name: Report coverage
        run: python -m coverage report --fail-under=100
      - name: Write coverage for Codecov
        run: python -m coverage xml -o coverage-codecov.xml
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from verify-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true

  fuzzing:
    name: fuzz the validation card parser
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs weekly and on demand rather than on pull requests or pushes.
    # verify-gates exempts this job, so a skipped run leaves main green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-fuzz.txt
      - name: Fuzz the card parser
        run: >-
          python -m fuzz.validation_cards fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  verify-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, verify, native, secrets, shared-conformance, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/verify.yml verify-gates --exempt codecov --exempt fuzzing
