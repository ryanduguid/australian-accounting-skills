name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements-test.txt

      - name: Verify skill metadata
        run: python -m unittest discover -s tests -v

      - name: Verify fabricated validation pack
        run: python scripts/validate_validation.py

      - name: Verify Skills CLI discovery
        run: python tests/verify_skills_cli.py

  shared-conformance:
    name: shared conformance
    permissions:
      contents: read
    uses: ryanduguid/release-policy/.github/workflows/verify-skills.yml@8b4de1ed339f1358b5f3e850b63412d8717d01da
    with:
      skills-verification-mode: subcontractor-accounting-v1
