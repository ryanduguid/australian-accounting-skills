name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "mypy==2.3.1" "ruff==0.16.6"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  verify:
    needs: lint
    timeout-minutes: 15
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements-test.txt

      - name: Verify skill metadata
        run: python -m unittest discover -s tests -v

      - name: Verify fabricated validation pack
        run: python scripts/validate_validation.py

      - name: Verify Skills CLI discovery
        run: python tests/verify_skills_cli.py

      - name: Verify coverage matrix
        run: python scripts/build_coverage.py --check

  secrets:
    name: secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  shared-conformance:
    name: shared conformance
    permissions:
      contents: read
    uses: ryanduguid/release-policy/.github/workflows/verify-skills.yml@87767ec809dc7f77bcd45808219adaf67841ae7b
    with:
      skills-verification-mode: subcontractor-accounting-v1

  verify-gates:
    # The one context branch protection requires from this workflow. It runs
    # on every event and fails unless every job it needs succeeded, and its
    # last step fails when a job in this file is missing from needs, so a new
    # job or matrix leg is enforced without a protection change.
    needs: [lint, verify, secrets, shared-conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, value in results.items() if value["result"] != "success"]
          if failed:
              raise SystemExit("Jobs did not succeed: " + ", ".join(failed))
      - name: Check out the workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Require needs to list every other job in this file
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, re
          text = open(".github/workflows/verify.yml", encoding="utf-8").read()
          keys = re.findall(r"(?m)^  [\"']?([A-Za-z_][\w-]*)[\"']?:", text.split("\njobs:\n", 1)[1])
          jobs = set(keys)
          if "verify-gates" not in jobs:
              raise SystemExit("Could not read the job list; the gate check needs updating")
          missing = sorted(jobs - {"verify-gates"} - set(json.loads(os.environ["RESULTS"])))
          if missing:
              raise SystemExit("Add these jobs to needs: " + ", ".join(missing))
