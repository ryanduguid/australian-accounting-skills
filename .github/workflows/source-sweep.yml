name: Source sweep

# Re-fetches every indexed primary source and reports which ones moved.
#
# The sweep is read-only on purpose. Recording a new digest means accepting
# that the page's current text is the one this repository stands on, and that
# is a reading decision, not a scheduling one. So the workflow reports and a
# person runs `python scripts/source_refresh.py --write` after reviewing. The
# issue therefore keeps saying the same thing until someone acts on it, which
# is the point.
#
# It only opens an issue for findings an edit here can resolve. Several of
# these hosts refuse automated retrieval outright and always will, so gating on
# those would hold an issue open for ever and teach the reader to ignore it.
# They stay in the body of every report, and the closing comment counts them
# rather than claiming every source was checked.
#
# `accounting-skills sweep-outcome` (tools/accounting-skills) is the only thing
# that turns the exit status into an outcome. It accepts exit 0 or 2 only with
# a report written during this run whose counts agree with that status; exit 1,
# any other code, a missing or stale report, or a report that contradicts the
# status fails the job.
#
# The sweep job builds that command and reads the web with a read-only token.
# Only the file job can write issues, and it runs no repository code.

on:
  schedule:
    # 19:00 UTC Sunday is early Monday in Australia, so a change lands at the
    # start of the working week rather than during it.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    # The sweep reads one page at a time, and a host that times out costs up
    # to 102 seconds a page. The 1 November 2026 sweep of 187 pages took 22
    # minutes; by 16 November the index held 581 pages, about 80 minutes at
    # that rate, and the 15 November run hit the old 40-minute limit.
    timeout-minutes: 180
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.sweep.outputs.outcome }}
      comment: ${{ steps.sweep.outputs.comment }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Build the outcome command
        working-directory: tools/accounting-skills
        # rustup reads the version from rust-toolchain.toml in this directory.
        run: |
          rustup toolchain install
          cargo build --locked --release --bin accounting-skills

      - name: Sweep the indexed sources
        id: sweep
        run: |
          rm -f sweep.md
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          python scripts/source_refresh.py --check --report sweep.md
          status=$?
          set -e
          tools/accounting-skills/target/release/accounting-skills sweep-outcome \
            --status "$status" --report sweep.md --started "$started" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-sweep
          path: sweep.md
          if-no-files-found: error

  file:
    name: file the result
    needs: sweep
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: Primary source sweep
    steps:
      - name: Download the report
        if: needs.sweep.outputs.outcome == 'findings'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-sweep

      - name: File the result
        if: needs.sweep.outputs.outcome == 'findings'
        env:
          MARKER: "<!-- source-sweep continuation -->"
        run: |
          # GitHub refuses an issue body or comment over 65,536 characters,
          # and the run artifact expires. So the body keeps whole lines up to
          # 60,000 bytes and each further 60,000 goes into a marked comment
          # that repeats the table header: every row stays on the issue.
          header=$(grep -n -m 1 '^| Outcome |' sweep.md | cut -d: -f1 || true)
          awk -v max=60000 -v head="${header:-0}" -v marker="$MARKER" '
            NR == head { h1 = $0 }
            NR == head + 1 { h2 = $0 }
            BEGIN { out = "part-0.md" }
            {
              size = length($0) + 1
              if (n + size > max) {
                close(out)
                part++
                out = "part-" part ".md"
                print marker > out
                n = length(marker) + 1
                if (h1 != "" && NR > head + 1) {
                  print h1 > out
                  print h2 > out
                  n += length(h1) + length(h2) + 2
                }
              }
              print > out
              n += size
            }' sweep.md
          if [ -f part-1.md ]; then
            printf '\nThe report continues in the comments below.\n' >> part-0.md
          fi
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file part-0.md
            echo "Updated issue #$existing"
            # The last run's continuation comments describe an older sweep.
            gh api --paginate "repos/$GH_REPO/issues/$existing/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
              while read -r id; do
                gh api --method DELETE "repos/$GH_REPO/issues/comments/$id"
              done
          else
            url=$(gh issue create --title "$TITLE" --body-file part-0.md --label monitoring)
            existing=${url##*/}
          fi
          part=1
          while [ -f "part-$part.md" ]; do
            gh issue comment "$existing" --body-file "part-$part.md"
            part=$((part + 1))
          done

      - name: Close the issue when nothing here needs an edit
        if: needs.sweep.outputs.outcome == 'clean'
        env:
          COMMENT: ${{ needs.sweep.outputs.comment }}
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "$COMMENT"
          fi
