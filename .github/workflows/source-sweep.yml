name: Source sweep

# Re-fetches every indexed primary source and reports which ones moved.
#
# The sweep is read-only on purpose. Recording a new digest means accepting
# that the page's current text is the one this repository stands on, and that
# is a reading decision, not a scheduling one. So the workflow reports and a
# person runs `python scripts/source_refresh.py --write` after reviewing. The
# issue therefore keeps saying the same thing until someone acts on it, which
# is the point.
#
# It only opens an issue for findings an edit here can resolve. Several of
# these hosts refuse automated retrieval outright and always will, so gating on
# those would hold an issue open for ever and teach the reader to ignore it.
# They stay in the body of every report, and the closing comment counts them
# rather than claiming every source was checked.
#
# `accounting-skills sweep-outcome` (tools/accounting-skills) is the only thing
# that turns the exit status into an outcome. It accepts exit 0 or 2 only with
# a report written during this run whose counts agree with that status; exit 1,
# any other code, a missing or stale report, or a report that contradicts the
# status fails the job.
#
# The sweep job builds that command and reads the web with a read-only token.
# Only the file job can write issues, and it runs no repository code.

on:
  schedule:
    # 19:00 UTC Sunday is early Monday in Australia, so a change lands at the
    # start of the working week rather than during it.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    # Sweeps in October and November 2026 took up to 23 minutes; the build adds a few.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.sweep.outputs.outcome }}
      comment: ${{ steps.sweep.outputs.comment }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Build the outcome command
        working-directory: tools/accounting-skills
        # rustup reads the version from rust-toolchain.toml in this directory.
        run: |
          rustup toolchain install
          cargo build --locked --release --bin accounting-skills

      - name: Sweep the indexed sources
        id: sweep
        run: |
          rm -f sweep.md
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          python scripts/source_refresh.py --check --report sweep.md
          status=$?
          set -e
          tools/accounting-skills/target/release/accounting-skills sweep-outcome \
            --status "$status" --report sweep.md --started "$started" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-sweep
          path: sweep.md
          if-no-files-found: error

  file:
    name: file the result
    needs: sweep
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: Primary source sweep
    steps:
      - name: Download the report
        if: needs.sweep.outputs.outcome == 'findings'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-sweep

      - name: File the result
        if: needs.sweep.outputs.outcome == 'findings'
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file sweep.md
            echo "Updated issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file sweep.md --label monitoring
          fi

      - name: Close the issue when nothing here needs an edit
        if: needs.sweep.outputs.outcome == 'clean'
        env:
          COMMENT: ${{ needs.sweep.outputs.comment }}
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE) | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "$COMMENT"
          fi
