<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14142B"/>
      <stop offset="50%" stop-color="#1F1B3E"/>
      <stop offset="100%" stop-color="#14142B"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/><line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/><line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1120" height="480" rx="20" fill="#1F1B3E" fill-opacity="0.6" stroke="#4C1D95" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Pill -->
  <rect x="120" y="125" width="280" height="36" rx="18" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="260" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FDA4AF" text-anchor="middle" letter-spacing="1">CLAUDE CODE AGENT SKILLS</text>

  <!-- Main Title -->
  <text x="120" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#roseGrad)">MaryAddisonHamilton</text>

  <!-- Subtitle -->
  <text x="120" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Nine agent skills for Australian public practice accounting, BAS, FBT, Div 7A, STP and workpapers.
  </text>

  <!-- Skill Badges -->
  <g transform="translate(120, 325)">
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#14142B" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="82" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">BAS Preparation</text>

    <rect x="180" y="0" width="175" height="42" rx="10" fill="#14142B" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="267" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Div 7A Compliance</text>

    <rect x="370" y="0" width="165" height="42" rx="10" fill="#14142B" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="452" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">STP Finalisation</text>

    <rect x="550" y="0" width="165" height="42" rx="10" fill="#14142B" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="632" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">FBT Return Pack</text>

    <rect x="730" y="0" width="190" height="42" rx="10" fill="#14142B" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="825" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Year-End Workpapers</text>
  </g>

  <!-- Code Snippet Box -->
  <g transform="translate(120, 395)">
    <rect x="0" y="0" width="920" height="125" rx="12" fill="#0C0A1D" stroke="#3B1768" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/><circle cx="36" cy="20" r="5" fill="#f59e0b"/><circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="20" y="55" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#FB7185">$ claude /plugin install australian-accounting-skills@ryanduguid</text>
    <text x="20" y="80" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#94a3b8">> Preparing BAS workpaper: Net GST (1A - 1B) ties to GST Control Account (diff: $0.00)</text>
    <text x="20" y="105" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#34D399">✓ 0 unverified hardcoded rates • Primary source verified via ato.gov.au</text>
  </g>
</svg>
