# Local gates, matching .github/workflows/verify.yml.
#
# Everything here already runs in CI. Running it before the commit lands turns
# a push, a wait and a red check into a few seconds at the keyboard. The two
# lists must not drift: tests/test_contributor_checks.py fails when a gate
# exists in one place and not the other.
#
# Ruff, Pyright, ShellCheck and actionlint are pinned to the versions verify.yml
# installs, so a hook that passes here cannot fail there on a version difference.
# The coverage-matrix hook runs the native command in tools/accounting-skills,
# so it needs Rust 1.99 or later; that directory's rust-toolchain.toml pins the
# version CI uses.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        # pyproject.toml already names the files to check, so the hook must not
        # narrow the run to the staged paths and miss a caller it broke.
        pass_filenames: false
        # The same Node.js wheel verify.yml installs, so the hook needs no download.
        additional_dependencies: ["nodejs-wheel-binaries==24.19.0"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: unittest
        name: skill metadata, coverage matrix and gate tests
        entry: python -m unittest discover -s tests
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        types: [python]

      - id: validation-pack
        name: fabricated validation pack
        entry: python scripts/validate_validation.py
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: ^(validation/|scripts/validate_validation\.py|\.claude/skills/)

      - id: skills-cli-discovery
        name: Skills CLI discovery
        entry: python tests/verify_skills_cli.py
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: ^(\.claude/skills/|\.claude-plugin/|tests/verify_skills_cli\.py)

      - id: coverage-matrix
        name: coverage.json matches the tree
        entry: cargo run --locked --manifest-path tools/accounting-skills/Cargo.toml -- build-coverage --check
        language: system
        pass_filenames: false
        files: ^(\.claude/skills/|validation/cases/|validation/results/|tests/|tools/accounting-skills/src/|coverage\.json|docs/skill-verification\.md)

      - id: whitespace
        name: git diff --cached --check
        # Pre-commit stashes unstaged changes; inspect the index being committed.
        entry: git diff --cached --check
        language: system
        pass_filenames: false

